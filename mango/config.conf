auto_reload_config=1

monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:1920,y:0
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0

xwayland_persistence=0

# startup
exec_once=sh -c 'umask 077; printf "%s\n" "$DBUS_SESSION_BUS_ADDRESS" > "$XDG_RUNTIME_DIR/dbus-address"'
exec_once=swayidle
exec_once=gentoo-pipewire-launcher restart
exec_once=foot -s
exec_once=mako
exec_once=swaybg -i ~/.local/share/wallpapers/supermassive_blackhole.png -m fill
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=sh -c 'sleep 1.5; exec waybar'

# appearance
no_border_when_single=1
cursor_theme=macOS
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0
border_px=1

# input
drag_lock=0
xkb_rules_options=caps:escape
mouse_accel_speed=-0.1
trackpad_natural_scrolling=1
trackpad_accel_speed=0.5
focus_cross_monitor=1

# mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# layout and window rules
tag_rule=id:*,layout_name:dwindle
window_rule=is_floating:1,width:900,height:600,app_id:^(qalcterm|taskterm)$

# applications
bind=SUPER,Return,spawn,footclient
bind=SUPER,b,spawn,librewolf
bind=SUPER,d,spawn,fuzzel
bind=SUPER,s,spawn_shell,pgrep -x --quiet wayfreeze || wayfreeze --after-freeze-cmd 'grim -g "$(slurp)" - | wl-copy; pkill -x wayfreeze'
bind=SUPER,v,spawn_shell,cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind=SUPER,period,spawn,~/.config/mango/scripts/emoji
bind=SUPER,z,spawn,env HOME=/home/hamzah/.local/share/vesktop vesktop-bin
bind=SUPER,w,spawn_shell,pkill -x waybar; exec waybar
bind=SUPER,less,spawn,pkill -SIGUSR1 waybar
bind=SUPER,c,spawn_shell,footclient --app-id qalcterm sh -c 'qalc; exec "$SHELL"'
bind=SUPER,t,spawn_shell,footclient --app-id taskterm sh -c 'task limit:20; exec "$SHELL"'

# hardware keys
bindl=NONE,XF86AudioRaiseVolume,spawn,~/.local/bin/audio-control up
bindl=NONE,XF86AudioLowerVolume,spawn,~/.local/bin/audio-control down
bindl=NONE,XF86AudioMute,spawn,~/.local/bin/audio-control mute
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -n set 5%-
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86TouchpadOff,spawn,notify-send -c off -i input-touchpad "Touchpad" "Disabled"
bind=NONE,XF86TouchpadOn,spawn,notify-send -c on -i input-touchpad "Touchpad" "Enabled"
bind=NONE,XF86Sleep,spawn_shell,(pidof -q waylock || waylock -fork-on-lock -init-color 0x000000 -input-color 0x202020 -fail-color 0x300000) && doas -n /usr/bin/sh -c 'echo mem > /sys/power/state'

# window management
bind=SUPER,m,quit
bind=SUPER,q,killclient
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,r,reload_config
bind=SUPER,o,togglejump

# rearrange windows
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+CTRL,space,dwindle_toggle_current_split

# move windows between monitors
bind=SUPER+ALT,h,tagmon,left
bind=SUPER+ALT,l,tagmon,right

# focus
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Tab,focuslast
bind=ALT,Tab,switcher,all_next
bind=ALT+SHIFT,Tab,switcher,all_prev

# tags
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

bind=SUPER+SHIFT,space,togglefloating
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+SHIFT,o,toggleoverview
