// show webgl prompt when requested
// defaultPref("librewolf.webgl.prompt.hide", false);

// disable noti prompts
defaultPref("permissions.default.desktop-notification", 2);

// i dont have av1 hardware support
defaultPref("media.av1.enabled", false);

// compact mode, vertical tabs, disable new nova look, and enable custom css
defaultPref("browser.uidensity", 1);
defaultPref("sidebar.verticalTabs", true);
defaultPref("sidebar.visibility", "hide-sidebar");
defaultPref("browser.nova.enabled", false);
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// unload tabs to save memory
defaultPref("browser.tabs.unloadOnLowMemory", true);

